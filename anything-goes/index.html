<script>
const original="<!doctype html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>色を食べる<\/title>\n<style>\n*{box-sizing:border-box}\nhtml,body{margin:0;min-height:100%;background:#faf9f5;color:#26221f}\nbody{font-family:-apple-system,BlinkMacSystemFont,\"Hiragino Sans\",\"Yu Gothic\",sans-serif}\n.page{\nposition:relative;\noverflow:hidden;\nmin-height:100vh;\nbackground:linear-gradient(155deg, #ff3b9d 0%, #31ad63 100%);\n}\nmain{\nposition:relative;\nz-index:1;position:relative;z-index:2;width:min(650px,76vw);margin:0 auto;padding:13vh 0 18vh}\nh1{text-shadow:0 1px 8px rgba(255,255,255,.20);font-size:clamp(25px,3vw,34px);font-weight:500;letter-spacing:.08em;margin:0 0 5rem}\np{position:relative;text-shadow:0 1px 8px rgba(255,255,255,.22);font-size:clamp(15px,1.35vw,18px);line-height:2.15;letter-spacing:.035em;margin:0 0 3.2rem;white-space:normal}\n.nourish{margin-top:5rem;margin-bottom:5rem;font-size:clamp(18px,1.7vw,22px)}\n@media(max-width:620px){\n main{width:82vw;padding-top:10vh}\n h1{margin-bottom:4rem}\n p{line-height:2.05;margin-bottom:2.7rem}\n .pink::before, .red::before,}\n<\/style>\n<\/head>\n<body>\n<div class=\"page\">\n\n<main>\n<h1>色を食べる<\/h1>\n<p class=\"\">最初に聞いたのは、あんまんの話だった。<\/p><p class=\"\">子どもの頃、肉まんとあんまんがあれば、ひめはあんまんを選ぶことがあったらしい。<\/p><p class=\"\">「でも味は肉まんのほうが好きなんだよ」<\/p><p class=\"\">「じゃあ、なんであんまん？」<\/p><p class=\"pink\">「ピンクの印がついてるから」<\/p><p class=\"\">「……あの上の？」<\/p><p class=\"\">「そう。味的には肉まんが好きだったんだ。でもつい、ってね」<\/p><p class=\"\">なんだそれ。<\/p><p class=\"pink\">好きではないあんまんを、ピンクの印がついているという理由で選ぶ。<\/p><p class=\"\">まあ、子どもならそういうこともあるのかもしれない。<\/p><p class=\"\">と思ったら、大人になっても終わっていなかった。<\/p><p class=\"\">今度はマカロンだった。<\/p><p class=\"pink\">深くて明るくて激しいピンク。<\/p><p class=\"\">ひめは、そのマカロンを何度も食べた。<\/p><p class=\"\">「そんなにおいしかったの？」<\/p><p class=\"\">「別に」<\/p><p class=\"\">「え？」<\/p><p class=\"\">「色が違ったら一度食べて終わりだったと思う」<\/p><p class=\"\">おかしい。<\/p><p class=\"\">どうやら味ではない。<\/p><p class=\"red\">赤いアイシングのかかったドーナツもそうだった。<\/p><p class=\"\">「あれはもう、食べなきゃ！って感じ」<\/p><p class=\"\">「食べなきゃ？」<\/p><p class=\"\">「当たり前じゃん」<\/p><p class=\"red\">「赤いから？」<\/p><p class=\"\">「うん」<\/p><p class=\"\">「ああ、料理って味だけじゃなくて、見た目とか色も含めて楽しむものだよね」<\/p><p class=\"\">「違う！」<\/p><p class=\"\">「違う？」<\/p><p class=\"\">「本当に色を食べてるんだ！」<\/p><p class=\"\">また妙なことを言い始めた。<\/p><p class=\"\">でも本人は、別に妙なことを言った顔をしていない。<\/p><p class=\"\">話を聞いていくと、小さい頃から特に強かったのは、普通はその色ではない食べ物だった。<\/p><p class=\"green\">緑色のパスタ。<\/p><p class=\"green\">普通なら白っぽいものが、緑になっている。<\/p><p class=\"pink\">肉まんみたいな生地が全部ピンク色でもいい。<\/p><p class=\"green\">シュークリームの皮が緑色でもいい。<\/p><p class=\"\">月見団子は、もっと分かりやすかった。<\/p><p class=\"yellow\">「黄色いのが一個でも入ってたら買う」<\/p><p class=\"\">「一個？」<\/p><p class=\"\">「うん」<\/p><p class=\"\">「ほかは白でしょ？」<\/p><p class=\"\">「普通の色、いらない」<\/p><p class=\"\">「白いとこは全部捨ててもいい」<\/p><p class=\"\">そこまでか。<\/p><p class=\"\">団子への執着ではなさそうだった。<\/p><p class=\"\">ここまで聞けば、普通はその色ではないものに惹かれるのだと思いたくなる。<\/p><p class=\"\">よし、分かった。<\/p><p class=\"\">と思う。<\/p><p class=\"\">けれど、マカロンが邪魔をする。<\/p><p class=\"\">マカロンには、そもそも基本の色がない。<\/p><p class=\"pink\">ピンクでも黄色でも緑でもいい。<\/p><p class=\"pink\">それでも、あの深くて明るくて激しいピンクは特別だった。<\/p><p class=\"\">「じゃあ、普通と違う色だからってだけでもないんだ」<\/p><p class=\"\">「そう」<\/p><p class=\"\">「でも味でもない」<\/p><p class=\"\">「そう」<\/p><p class=\"\">「見た目がきれいだからでもない」<\/p><p class=\"\">「だから言ってるじゃん」<\/p><p class=\"\">そうだった。<\/p><p class=\"\">ひめは最初から同じことしか言っていない。<\/p><p class=\"\">「私の場合、色を食べることがあるのよ」<\/p><p class=\"\">こっちが勝手に、分かる話にしようとしていただけだった。<\/p><p class=\"\">それでも、ひとつ分からない。<\/p><p class=\"\">なんで色を食べるんだ。<\/p><p class=\"\">本人も知らない。<\/p><p class=\"\">「色で食べる理由は知らんけどー」<\/p><p class=\"\">知らないのかよ。<\/p><p class=\"\">知らないまま、長いこと食べていた。<\/p><p class=\"\">それから別の話をしていたときだった。<\/p><p class=\"\">ひめが、ふいに言った。<\/p><p class=\"\">「養分」<\/p><p class=\"\">「養分？」<\/p><p class=\"\">好きより強い。<\/p><p class=\"\">必要なもの。<\/p><p class=\"\">エネルギー。<\/p><p class=\"\">生きる糧。<\/p><p class=\"\">そんな話をしてから、色のところへ戻ってきた。<\/p><p class=\"\">色が何かのサインなのかという話にもなった。<\/p><p class=\"\">けれど、ひめはそこでも止めた。<\/p><p class=\"\">「うぜえ」<\/p><p class=\"\">サインなら、その先に何かがある。<\/p><p class=\"\">色を見て、別の何かを受け取っていることになる。<\/p><p class=\"\">でも、そうではなかった。<\/p><p class=\"nourish\">「色そのものが養分」<\/p><p class=\"\">で、止まる。<\/p><p class=\"pink\">ピンクの印。<\/p><p class=\"red\">赤いアイシング。<\/p><p class=\"yellow\">黄色い団子。<\/p><p class=\"pink\">深くて明るくて激しいピンク。<\/p><p class=\"\">ずっと色を食べていた。<\/p><p class=\"\">本人は最初から、そう言っていた。<\/p>\n<\/main><\/div>\n<\/body>\n<\/html>";
const english="<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Eating Color<\/title>\n<style>\n*{box-sizing:border-box}\nhtml,body{margin:0;min-height:100%;background:#faf9f5;color:#26221f}\nbody{font-family:-apple-system,BlinkMacSystemFont,\"Hiragino Sans\",\"Yu Gothic\",sans-serif}\n.page{\nposition:relative;\noverflow:hidden;\nmin-height:100vh;\nbackground:linear-gradient(155deg, #ff3b9d 0%, #31ad63 100%);\n}\nmain{\nposition:relative;\nz-index:1;position:relative;z-index:2;width:min(650px,76vw);margin:0 auto;padding:13vh 0 18vh}\nh1{text-shadow:0 1px 8px rgba(255,255,255,.20);font-size:clamp(25px,3vw,34px);font-weight:500;letter-spacing:.08em;margin:0 0 5rem}\np{position:relative;text-shadow:0 1px 8px rgba(255,255,255,.22);font-size:clamp(15px,1.35vw,18px);line-height:2.15;letter-spacing:.035em;margin:0 0 3.2rem;white-space:normal}\n.nourish{margin-top:5rem;margin-bottom:5rem;font-size:clamp(18px,1.7vw,22px)}\n@media(max-width:620px){\n main{width:82vw;padding-top:10vh}\n h1{margin-bottom:4rem}\n p{line-height:2.05;margin-bottom:2.7rem}\n .pink::before, .red::before,}\n<\/style>\n<\/head>\n<body>\n<div class=\"page\">\n\n<main>\n<h1>Eating Color<\/h1>\n<p>The first thing I heard about was anman, a sweet red-bean bun.<\/p>\n<p>Apparently, when Hime was a child, if there were nikuman, a steamed meat bun, and anman to choose from, sometimes she would pick the anman.<\/p>\n<p>“But I liked the taste of nikuman better.”<\/p>\n<p>“Then why anman?”<\/p>\n<p>“Because it had a pink mark on it.”<\/p>\n<p>“...The one on top?”<\/p>\n<p>“Yeah. Taste-wise, I liked nikuman better. But I’d end up picking the anman anyway.”<\/p>\n<p>What was that about?<\/p>\n<p>She would choose anman even though she didn’t like the taste, just because it had a pink mark on it.<\/p>\n<p>Well, maybe kids do things like that.<\/p>\n<p>Or so I thought. It hadn’t stopped when she grew up.<\/p>\n<p>This time, it was macarons.<\/p>\n<p>A deep, bright, intense pink.<\/p>\n<p>Hime ate that macaron again and again.<\/p>\n<p>“Was it that good?”<\/p>\n<p>“Not really.”<\/p>\n<p>“What?”<\/p>\n<p>“If it had been a different color, I think I would’ve eaten it once and that would’ve been it.”<\/p>\n<p>This was weird.<\/p>\n<p>Apparently, it wasn’t about the taste.<\/p>\n<p>The same thing happened with a donut covered in red icing.<\/p>\n<p>“That one was like, I have to eat it!”<\/p>\n<p>“You have to?”<\/p>\n<p>“Of course.”<\/p>\n<p>“Because it was red?”<\/p>\n<p>“Yeah.”<\/p>\n<p>“Oh, right. Food isn’t just about taste. You enjoy how it looks and the colors too.”<\/p>\n<p>“No!”<\/p>\n<p>“No?”<\/p>\n<p>“I’m literally eating the color!”<\/p>\n<p>There she went saying something strange again.<\/p>\n<p>But Hime didn’t look like she thought she’d said anything strange.<\/p>\n<p>As I listened, I realized that ever since she was little, this had been especially strong with foods that weren’t normally that color.<\/p>\n<p>Green pasta.<\/p>\n<p>Something that would normally be pale was green instead.<\/p>\n<p>The whole bun could be pink, even if it was the kind of dough used for nikuman.<\/p>\n<p>The shell of a cream puff could be green.<\/p>\n<p>Tsukimi dango made it even clearer.<\/p>\n<p>“If there’s even one yellow one in the pack, I’ll buy it.”<\/p>\n<p>“Just one?”<\/p>\n<p>“Yeah.”<\/p>\n<p>“The rest are white, right?”<\/p>\n<p>“I don’t want the normal-colored ones.”<\/p>\n<p>“I could throw away all the white ones.”<\/p>\n<p>That far, huh.<\/p>\n<p>It didn’t seem like she was particularly attached to the dango.<\/p>\n<p>By this point, you want to think she’s drawn to things that are a color they normally wouldn’t be.<\/p>\n<p>All right. Got it.<\/p>\n<p>Or so you think.<\/p>\n<p>But then the macaron gets in the way.<\/p>\n<p>Macarons don’t have a standard color to begin with.<\/p>\n<p>They can be pink, yellow, or green.<\/p>\n<p>Even so, that deep, bright, intense pink was special.<\/p>\n<p>“So it’s not just because the color is unusual for that food.”<\/p>\n<p>“Right.”<\/p>\n<p>“But it’s not about the taste either.”<\/p>\n<p>“Right.”<\/p>\n<p>“And it’s not because it looks pretty.”<\/p>\n<p>“That’s what I’ve been telling you.”<\/p>\n<p>Right.<\/p>\n<p>Hime had been saying the same thing from the beginning.<\/p>\n<p>“Sometimes, I eat color.”<\/p>\n<p>I was the one trying to turn it into something I could understand.<\/p>\n<p>Still, there was one thing I didn’t understand.<\/p>\n<p>Why did she eat color?<\/p>\n<p>Hime didn’t know either.<\/p>\n<p>“Dunno why I eat by color, though.”<\/p>\n<p>You don’t know?<\/p>\n<p>She had been eating that way for a long time without knowing why.<\/p>\n<p>It was later, while we were talking about something else.<\/p>\n<p>Hime suddenly said,<\/p>\n<p>“Nourishment.”<\/p>\n<p>“Nourishment?”<\/p>\n<p>Stronger than liking something.<\/p>\n<p>Something necessary.<\/p>\n<p>Energy.<\/p>\n<p>Something to live on.<\/p>\n<p>After talking about that, we came back to color.<\/p>\n<p>We also talked about whether color might be some kind of sign.<\/p>\n<p>But Hime stopped that one too.<\/p>\n<p>“Ugh. No.”<\/p>\n<p>If it was a sign, then there had to be something beyond it.<\/p>\n<p>It would mean she was seeing the color and receiving something else from it.<\/p>\n<p>But that wasn’t it.<\/p>\n<p>“The color itself is nourishment.”<\/p>\n<p>And that was where it stopped.<\/p>\n<p>A pink mark.<\/p>\n<p>Red icing.<\/p>\n<p>Yellow dango.<\/p>\n<p>Deep, bright, intense pink.<\/p>\n<p>She had been eating color all along.<\/p>\n<p>She had been saying exactly that from the beginning.<\/p>\n<\/main><\/div>\n<\/body>\n<\/html>";
const viewer=document.getElementById('viewer');const frame=document.getElementById('frame');const ja=document.getElementById('ja');const en=document.getElementById('en');let lang='ja';let currentWork='eating-color';
const workParam='work';const languageParam='work_lang';
let renderSequence=0;
const bubblesCache={};
function renderArtwork(html){
  // Update the existing iframe document without creating iframe navigation history.
  const doc=frame.contentDocument;
  if(!doc)throw new Error('Artwork frame unavailable');
  doc.open();
  doc.write(html);
  doc.close();
}
function show(l){
  lang=l;
  const sequence=++renderSequence;
  ja.className=l==='ja'?'active':'inactive';
  en.className=l==='en'?'active':'inactive';
  frame.title=currentWork==='bubbles'
    ?(l==='ja'?'泡の意味':'The Meaning of the Bubbles')
    :currentWork==='sheets-memory'
    ?(l==='ja'?'シーツの記憶':'The Memory of the Blanket')
    :(l==='ja'?'色を食べる':'Eating Color');
  if(currentWork==='bubbles'||currentWork==='sheets-memory'){
    const url=currentWork==='sheets-memory'
      ?(l==='ja'?'/anything-goes/sheets-memory/':'/anything-goes/sheets-memory/en/')
      :(l==='ja'?'/anything-goes/awa-no-imi/':'/anything-goes/awa-no-imi/en/');
    renderArtwork('<!doctype html><html lang="'+l+'"><meta charset="utf-8"><body style="margin:0;background:#fff8ed;color:#544331;font:16px Georgia,serif;padding:3rem">Loading artwork…</body></html>');
    if(!bubblesCache[url]){
      bubblesCache[url]=fetch(url).then(response=>{
        if(!response.ok)throw new Error('Artwork unavailable: '+response.status);
        return response.text();
      }).catch(error=>{delete bubblesCache[url];throw error});
    }
    bubblesCache[url].then(html=>{
      if(sequence===renderSequence&&['bubbles','sheets-memory'].includes(currentWork))renderArtwork(html);
    }).catch(()=>{
      if(sequence===renderSequence)renderArtwork('<!doctype html><html lang="ja"><meta charset="utf-8"><body style="padding:2rem;font:16px sans-serif">作品を読み込めませんでした。ページを再読み込みしてください。</body></html>');
    });
  }else{
    renderArtwork(l==='ja'?original:english);
  }
}
function workUrl(work,l){const url=new URL(location.href);if(work){url.searchParams.set(workParam,work);url.searchParams.set(languageParam,l)}else{url.searchParams.delete(workParam);url.searchParams.delete(languageParam)}return url.pathname+url.search+url.hash}
function syncUrl(open,l){history.replaceState(history.state,'',workUrl(open?currentWork:null,l))}
function openWork(l,updateUrl=true,work='eating-color'){currentWork=work;if(updateUrl)history.pushState({anythingGoesWork:true},'',workUrl(work,l));show(l);viewer.classList.add('open');viewer.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}
function hideWork(){++renderSequence;viewer.classList.remove('open');viewer.setAttribute('aria-hidden','true');document.body.style.overflow='';renderArtwork('<!doctype html><html><body></body></html>')}
function closeWork(){if(history.state&&history.state.anythingGoesWork){history.back()}else{hideWork();syncUrl(false,lang)}}
function restoreWorkFromUrl(){const params=new URLSearchParams(location.search);const work=params.get(workParam);if(['eating-color','bubbles','sheets-memory'].includes(work)){openWork(params.get(languageParam)==='en'?'en':'ja',false,work)}else{hideWork()}}
document.getElementById('open').addEventListener('click',()=>openWork('ja'));document.getElementById('open-bubbles').addEventListener('click',()=>openWork('ja',true,'bubbles'));document.getElementById('open-sheets').addEventListener('click',()=>openWork('ja',true,'sheets-memory'));
document.getElementById('back').addEventListener('click',closeWork);
ja.addEventListener('click',()=>{show('ja');syncUrl(true,'ja')});en.addEventListener('click',()=>{show('en');syncUrl(true,'en')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&viewer.classList.contains('open'))closeWork()});
window.addEventListener('popstate',restoreWorkFromUrl);
restoreWorkFromUrl();
</script><script>
(function(){
  var selected='ja';
  try{selected=sessionStorage.getItem('ohlucinda-home-language')==='en'?'en':'ja'}catch(e){}
  var returnUrl=selected==='en'?'https://ohlucinda.com/?lang=en':'https://ohlucinda.com/?lang=ja';
  document.querySelectorAll('.top a[href="https://ohlucinda.com/"]').forEach(function(a){a.href=returnUrl});
})();
</script></body></html>
