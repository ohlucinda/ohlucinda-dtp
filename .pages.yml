media:
  input: images
  output: /images
content:
  - name: months
    label: Months (Journal)
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename:
      template: "{fields.date}-{fields.permalink}.md"
      field: false
    view:
      fields: [title, date]
      primary: title
    operations:
      rename: false
      delete: false
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: permalink
        label: Public URL (e.g. /akai-mono/)
        type: string
        required: true
      - name: added_at
        label: Date added to Months
        type: string
        required: false
        default: ""
        description: "Optional. Leave blank if unknown; otherwise YYYY-MM-DD."
        pattern: "^([0-9]{4}-[0-9]{2}-[0-9]{2})?$"
      - name: updated_at
        label: Date of published update
        type: string
        required: false
        default: ""
        description: "Optional. Leave blank if unknown; otherwise YYYY-MM-DD."
        pattern: "^([0-9]{4}-[0-9]{2}-[0-9]{2})?$"
      - name: layout
        label: Layout
        type: string
        default: default
      - name: body
        label: Article (source-preserving)
        type: code
        options:
          format: markdown
